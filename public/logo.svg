<?xml version="1.0" encoding="UTF-8"?>
<!--
  AI Gym Coach Pro — app mark.

  Matches the in-app brand lockup: the lime "activity" pulse inside a rounded
  square with a lime tint + border, on the app's near-black background.
  Colors are the app's design tokens (lime #a3e635, background #050608).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Gym Coach Pro">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12160c"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#a3e635" opacity="0.12"/>
  <rect x="30" y="30" width="452" height="452" rx="100" fill="none" stroke="#a3e635" stroke-opacity="0.45" stroke-width="10"/>

  <!-- Heart-rate / activity pulse -->
  <path
    d="M92 256 H170 L212 154 L268 358 L312 256 H420"
    fill="none"
    stroke="#a3e635"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>
