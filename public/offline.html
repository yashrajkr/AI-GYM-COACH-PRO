<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — AI Gym Coach Pro</title>
  <style>
    :root {
      --bg: #050608;
      --fg: #e8edf2;
      --muted: #71717a;
      --accent: #a3e635;
      --border: #1f2530;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      text-align: center;
      padding: 2.5rem 2rem;
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: rgba(255,255,255,0.02);
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.25rem;
      border-radius: 9999px;
      background: rgba(163,230,53,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem;
      font-weight: 600;
    }
    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    button {
      background: var(--accent);
      color: #050608;
      border: 0;
      padding: 0.6rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    .hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>You&rsquo;re offline</h1>
    <p>
      We can&rsquo;t reach the AI Gym Coach Pro servers right now.
      Your recent workouts are saved on this device and will sync
      automatically once you&rsquo;re back online.
    </p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">Tip: cached pages continue to work offline.</div>
  </main>
  <script>
    // Auto-reload when connection is restored.
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
